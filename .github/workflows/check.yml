# Checks a working branch without sending anything to Apple: builds the app for the iPhone simulator,
# runs its self-test there and takes screenshots. Needs no secrets.
name: Check

on:
  workflow_dispatch:
  push:
    branches-ignore: [main]

jobs:
  check:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Check line endings (must be LF)
        run: |
          if grep -rlI $'\r' Sources Shared Widget Config UITests scripts project.yml .github; then
            echo "::error::the files above have Windows line endings (CRLF)"; exit 1
          fi

      - name: Check that every text is translated
        run: python3 scripts/check-texts.py

      - name: Generate the Xcode project
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodegen generate

      - name: Build for the simulator
        run: |
          mkdir -p build shots
          if ! xcodebuild -project Volna.xcodeproj -scheme VolnaUITests -configuration Debug \
               -destination 'generic/platform=iOS Simulator' -derivedDataPath build/dd build-for-testing \
               CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual AD_HOC_CODE_SIGNING_ALLOWED=YES > build.log 2>&1; then
            echo "===== errors ====="; grep -E "error:" build.log | sort -u | head -80
            exit 1
          fi
          grep -E "(Sources|Shared|Widget)/.*warning:" build.log | sort -u | head -30 || true

      - name: Run and take screenshots
        timeout-minutes: 48
        run: bash scripts/simulator.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots
          path: shots
          retention-days: 7

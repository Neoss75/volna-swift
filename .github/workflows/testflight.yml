# Builds the Swift version of «Волна» on a GitHub Mac.
# With the four Apple secrets set it signs the app and uploads it to TestFlight;
# without them it only checks that the app builds. Either way it keeps an unsigned Volna-swift.ipa for 14 days.
# Secrets (Settings → Secrets and variables → Actions), the same values as in volna-ios:
#   APPLE_TEAM_ID   — Team ID (10 characters, developer.apple.com → Membership)
#   ASC_KEY_ID      — App Store Connect API key ID
#   ASC_ISSUER_ID   — Issuer ID shown above the list of keys
#   ASC_KEY_P8      — full text of the AuthKey_XXXX.p8 file
# Runs after every upload to main that changes the app (not only documents), or by hand: Actions → "TestFlight" → Run workflow.
# By hand with "ipa_only" ticked it skips TestFlight and keeps an unsigned Volna-swift.ipa (to sign with AltStore or Sideloadly).
name: TestFlight

on:
  workflow_dispatch:
    inputs:
      ipa_only:
        description: 'Only an unsigned .ipa, no TestFlight upload'
        type: boolean
        default: false
  push:
    branches: [main]
    paths-ignore: ['**.md', 'LICENSE*', '.gitignore', '.gitattributes', '.github/**', 'UITests/**']

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the Apple keys are set
        id: keys
        run: |
          if [ "${{ inputs.ipa_only }}" = "true" ]; then
            echo "::notice::Only an unsigned .ipa this time, no TestFlight upload"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$TEAM_ID" ] || [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_KEY_P8" ]; then
            echo "::warning::Apple keys are not set yet (see the top of testflight.yml): only a build check, no TestFlight upload"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check line endings (must be LF)
        run: |
          if grep -rlI $'\r' Sources Shared Widget Config scripts project.yml .github; then
            echo "::error::the files above have Windows line endings (CRLF)"; exit 1
          fi

      - name: Use Xcode 26 (needed for Liquid Glass and for App Store uploads)
        run: |
          X=/Applications/Xcode_26.3.app
          [ -d "$X" ] || X=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -n 1)
          sudo xcode-select -s "$X"
          xcodebuild -version

      - name: Generate the Xcode project
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodegen --version
          xcodegen generate
          xcodebuild -version

      - name: Build only (no keys, or only an .ipa asked for)
        if: steps.keys.outputs.ok != 'true'
        run: |
          mkdir -p build
          if ! xcodebuild -project Volna.xcodeproj -scheme Volna -configuration Release \
               -destination 'generic/platform=iOS' -archivePath build/Volna.xcarchive archive \
               CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
               CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" > build.log 2>&1; then
            echo "===== errors ====="; grep -E "error:|fatal error" build.log | head -80
            echo "===== end of log ====="; tail -n 120 build.log
            exit 1
          fi
          grep -E "warning:" build.log | sort -u | head -40 || true
          tail -n 5 build.log
          mkdir -p Payload
          cp -R build/Volna.xcarchive/Products/Applications/Volna.app Payload/
          zip -qry Volna-swift.ipa Payload
          ls -l Volna-swift.ipa

      - uses: actions/upload-artifact@v4
        if: steps.keys.outputs.ok != 'true'
        with:
          name: Volna-swift-ipa
          path: Volna-swift.ipa
          retention-days: 14

      - name: API key for signing
        if: steps.keys.outputs.ok == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          bash scripts/write-key.sh "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"
          echo "KEY_PATH=$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" >> "$GITHUB_ENV"

      # Signing here would create one more development certificate on every run (each Mac is new), and Apple
      # limits their number. So the archive is built unsigned, the entitlements are put in with an ad-hoc signature,
      # and the real signature (cloud-managed Apple Distribution certificate) is made during the export.
      - name: Build
        if: steps.keys.outputs.ok == 'true'
        run: |
          mkdir -p build
          if ! xcodebuild -project Volna.xcodeproj -scheme Volna -configuration Release \
               -destination 'generic/platform=iOS' -archivePath build/Volna.xcarchive archive \
               DEVELOPMENT_TEAM="$TEAM_ID" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
               CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" > build.log 2>&1; then
            echo "===== errors ====="; grep -E "error:|fatal error" build.log | head -80
            echo "===== end of log ====="; tail -n 120 build.log
            exit 1
          fi
          tail -n 10 build.log
          APP=build/Volna.xcarchive/Products/Applications/Volna.app
          codesign --force --sign - --entitlements Config/Volna.entitlements "$APP/PlugIns/VolnaWidget.appex"
          codesign --force --sign - --entitlements Config/Volna.entitlements "$APP"
          # the same app as an unsigned .ipa, to sign with AltStore or Sideloadly
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry Volna-swift.ipa Payload
          ls -l Volna-swift.ipa

      - uses: actions/upload-artifact@v4
        if: steps.keys.outputs.ok == 'true'
        with:
          name: Volna-swift-ipa
          path: Volna-swift.ipa
          retention-days: 14

      - name: Sign and check
        if: steps.keys.outputs.ok == 'true'
        run: |
          sed -e "s/TEAM_ID_PLACEHOLDER/$TEAM_ID/" Config/ExportOptions.plist > build/ExportOptions.plist
          sed -e 's#<string>upload</string>#<string>export</string>#' build/ExportOptions.plist > build/LocalOptions.plist
          if ! xcodebuild -exportArchive -archivePath build/Volna.xcarchive -exportPath build/local \
               -exportOptionsPlist build/LocalOptions.plist \
               -allowProvisioningUpdates -authenticationKeyPath "$KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" > export.log 2>&1; then
            echo "===== errors ====="; grep -iE "error|failed" export.log | head -60
            echo "===== end of log ====="; tail -n 120 export.log
            exit 1
          fi
          mkdir -p build/ipa
          unzip -q build/local/*.ipa -d build/ipa
          for B in build/ipa/Payload/Volna.app build/ipa/Payload/Volna.app/PlugIns/VolnaWidget.appex; do
            codesign --verify --strict "$B"
            codesign -d --entitlements :- "$B" 2>/dev/null | grep -q 'group.com.neoss75.volna' || { echo "::error::$(basename "$B") has lost the app group"; exit 1; }
            codesign -dvv "$B" 2>&1 | grep -q 'Authority=Apple Distribution' || { echo "::error::$(basename "$B") is not signed for distribution"; exit 1; }
            echo "$(basename "$B"): signed for distribution, the app group is there"
          done

      - name: Upload to TestFlight
        if: steps.keys.outputs.ok == 'true'
        run: |
          if ! xcodebuild -exportArchive -archivePath build/Volna.xcarchive -exportPath build/export \
               -exportOptionsPlist build/ExportOptions.plist \
               -allowProvisioningUpdates -authenticationKeyPath "$KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" > upload.log 2>&1; then
            echo "===== errors ====="; grep -iE "error|failed" upload.log | head -60
            echo "===== end of log ====="; tail -n 120 upload.log
            exit 1
          fi
          tail -n 20 upload.log
          echo "::notice::Build $BUILD_NUMBER uploaded. In 5–15 minutes it appears in TestFlight on your iPhone."

      - name: Remove the key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"

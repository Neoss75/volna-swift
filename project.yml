# XcodeGen description of the Xcode project. The .xcodeproj itself is generated on the build machine
# ("xcodegen generate") and is never committed.
name: Volna
options:
  bundleIdPrefix: com.neoss75
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: ru
settings:
  base:
    MARKETING_VERSION: "0.8.1"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
targets:
  Volna:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
      - path: Shared
    dependencies:
      - target: VolnaWidget
    settings:
      base:
        PRODUCT_NAME: Volna
        PRODUCT_BUNDLE_IDENTIFIER: com.neoss75.volna.swift
        INFOPLIST_FILE: Config/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: NO
        CODE_SIGN_ENTITLEMENTS: Config/Volna.entitlements
    scheme: {}
  VolnaWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: VolnaWidget
        PRODUCT_BUNDLE_IDENTIFIER: com.neoss75.volna.swift.widget
        INFOPLIST_FILE: Config/Widget-Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Config/Volna.entitlements
        ENABLE_PREVIEWS: NO
  # presses and swipes the real screen in the simulator, only for the check
  VolnaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: Volna
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.neoss75.volna.swift.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Volna
schemes:
  VolnaUITests:
    build:
      targets:
        Volna: all
        VolnaUITests: [test]
    test:
      config: Debug
      targets:
        - VolnaUITests
